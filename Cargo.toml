[workspace]
resolver = "3"
members = [
    "crates/annora-core",
    "crates/annora-substrate",
    "crates/annora-memory",
    "crates/annora-kernel",
    "crates/annora-perception",
    "crates/annora-inference",
    "crates/annora-voice",
    "crates/annora-agents",
    "crates/annora-audit",
    "crates/annora-sync",
    "crates/annora-auth",
    "crates/annora-constitution",
    "crates/annora-ui",
    "crates/annora-metrics",
    "crates/annora-substrate-linux",
    "crates/annora-substrate-windows",
    "crates/annora-substrate-macos",
    "crates/annora-substrate-redox",
    "crates/annora-substrate-mobile",
    "crates/annora-substrate-web",
    "crates/annora-daemon",
    "agents/mail",
    "agents/calendar",
    "agents/code",
    "agents/home",
    "agents/wallet-readonly",
    "conformance",
    "xtask",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
biscuit-auth = "5"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
chacha20poly1305 = "0.10"
rand = "0.8"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
bytes = { version = "1", features = ["serde"] }
async-trait = "0.1"
redb = "2"
instant-distance = "0.6"
wasmtime = "29"
proptest = "1"
sha2 = "0.10"
bincode = "1.3"
semver = { version = "1.0", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"

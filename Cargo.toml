[workspace]
resolver = "3"
members = [
    "crates/hakille-core",
    "crates/hakille-substrate",
    "crates/hakille-memory",
    "crates/hakille-kernel",
    "crates/hakille-perception",
    "crates/hakille-inference",
    "crates/hakille-voice",
    "crates/hakille-audio",
    "crates/hakille-agents",
    "crates/hakille-audit",
    "crates/hakille-sync",
    "crates/hakille-auth",
    "crates/hakille-constitution",
    "crates/hakille-ui",
    "crates/hakille-ui-shell",
    "crates/hakille-ipc",
    "crates/hakille-ui-protocol",
    "crates/hakille-design",
    "crates/hakille-ui-model",
    "crates/hakille-ui-platform",
    "crates/hakille-ui-desktop",
    "crates/hakille-spikes",
    "crates/hakille-keystore",
    "crates/hakille-metrics",
    "crates/hakille-substrate-linux",
    "crates/hakille-substrate-windows",
    "crates/hakille-substrate-macos",
    "crates/hakille-substrate-redox",
    "crates/hakille-substrate-mobile",
    "crates/hakille-substrate-web",
    "crates/hakille-daemon",
    "agents/mail",
    "agents/calendar",
    "agents/code",
    "agents/home",
    "agents/wallet-readonly",
    "conformance",
    "xtask",
]

# Socle commun : MSRV 1.95 (édition 2024, aligné CI + rust-toolchain).
# Les crates gardent leur propre `edition = "2024"` ; pas de [workspace.lints]
# imposé (risque de casser les ~60 lints pré-existants vus en clippy,
# traitement incrémental prévu).
[workspace.package]
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
biscuit-auth = "5"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
chacha20poly1305 = "0.10"
rand = "0.8"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde", "js"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
bytes = { version = "1", features = ["serde"] }
async-trait = "0.1"
redb = "2"
instant-distance = "0.6"
wasmtime = "48"
proptest = "1"
sha2 = "0.10"
bincode = "1.3"
semver = { version = "1.0", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"

# --- Profils de compilation -------------------------------------------------
# Le décodeur Qwen (candle) est le CHEMIN CHAUD de l'inférence. Sans
# optimisation, un tour en profil debug dure ~478 s contre ~24 s en release
# (mesuré, 64 tokens, CPU) : le HUD paraît alors "ne pas répondre".
# On optimise donc les dépendances CHAUDES même en dev — `cargo run` reste
# utilisable pour de l'inférence réelle, sans toucher au code du workspace.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3


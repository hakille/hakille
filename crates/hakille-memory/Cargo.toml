[package]
name = "hakille-memory"
version = "0.1.0"
edition = "2024"

[dependencies]
hakille-core = { path = "../hakille-core" }
redb = "2.0.0" # using available version
instant-distance = "0.6" # using available version
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
chrono = "0.4"
uuid = { workspace = true }
async-trait = "0.1"
bytes = "1.9"
bincode = "1.3"

[dev-dependencies]
# Indispensable (Agent A, graphe RAM) : les tests unitaires de `hydrate_from`
# et `persist_to_with_gc` sont async et exigent un runtime, comme dans toutes
# les autres crates du workspace (`#[tokio::test]`).
tokio = { workspace = true }

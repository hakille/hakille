[package]
name = "hakille-ui-platform"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Hakille platform adapters: DesktopHost trait (window/tray/hotkey/overlay/clipboard), pure + testable"

[dependencies]
global-hotkey = { version = "0.6", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
default = []
native = ["dep:global-hotkey"]

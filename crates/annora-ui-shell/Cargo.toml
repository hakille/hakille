[package]
name = "annora-ui-shell"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Annora ambient shell bridge: headless state → Slint-native compositor (no WebView)"
# Rendu Slint derrière feature `render` (défaut headless) : garde check/test
# rapides + compat Redox. Voir docs/PLAN_NUIT_UI.md. Activer par défaut
# casserait `cargo check --target x86_64-unknown-redox` (Slint/winit non portable).

[dependencies]
annora-core = { path = "../annora-core" }
annora-ui = { path = "../annora-ui" }
annora-audit = { path = "../annora-audit" }
annora-memory = { path = "../annora-memory" }
annora-design = { path = "../annora-design" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
# Rendu réel (ADR-007) derrière la feature `render` pour garder
# check/test/conformance rapides par défaut.
slint = { version = "1", optional = true, features = ["backend-winit", "renderer-winit-software", "software-renderer-systemfonts"] }
tray-icon = { version = "0.20", optional = true }
muda = { version = "0.16", optional = true }
global-hotkey = { version = "0.6", optional = true }
# D-Bus session (StatusNotifierWatcher) : vérifié à la compilation sur tous
# les OS, appelé uniquement sur Linux pour refuser le succès silencieux.
zbus = { version = "5", optional = true }
tokio = { workspace = true, optional = true }

[build-dependencies]
slint-build = { version = "1", optional = true }

[features]
default = []
render = ["dep:slint", "dep:tray-icon", "dep:muda", "dep:global-hotkey", "dep:slint-build", "dep:zbus", "dep:tokio"]

[dev-dependencies]
serde_json = { workspace = true }

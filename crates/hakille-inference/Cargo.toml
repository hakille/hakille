[package]
name = "hakille-inference"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
hakille-core = { path = "../hakille-core" }
hakille-substrate = { path = "../hakille-substrate" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
sha2 = { workspace = true }
ort = { version = "=2.0.0-rc.14", features = ["download-binaries", "copy-dylibs"] }
# REAL-04 — génération LLM Qwen 100% réelle (pur Rust, CPU v1, pas de C++/cmake) :
# trio candle épinglé en synchro (même version upstream 0.11.0, sinon types
# quantifiés incompatibles) + tokenizers BPE Qwen sans backend C (onig/esaxx
# désactivés via default-features=false, fancy-regex pur Rust pour le
# pré-tokenizer Qwen2). Device CPU uniquement (GPU en TODO documenté).
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
candle-transformers = { version = "=0.11.0", default-features = false }
tokenizers = { version = "=0.23.1", default-features = false, features = ["fancy-regex"] }

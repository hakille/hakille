[package]
name = "annora-memory"
version = "0.1.0"
edition = "2024"

[dependencies]
annora-core = { path = "../annora-core" }
redb = "2.0.0" # using available version
instant-distance = "0.6" # using available version
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
chrono = "0.4"
uuid = { version = "1.12", features = ["v4", "serde"] }
async-trait = "0.1"
bytes = "1.9"
bincode = "1.3"

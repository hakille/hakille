[package]
name = "hakille-capability"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Universal Capability Contract, Translators, Registry, Execution and Security Engine for Hakille"
repository = "https://github.com/hakille/hakille"

[dependencies]
# Workspace internal dependencies
hakille-core = { path = "../hakille-core" }
hakille-audit = { path = "../hakille-audit" }

# Serialization & Schemas
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
semver = { workspace = true }

# Error Handling & Diagnostics
thiserror = { workspace = true }
tracing = { workspace = true }

# Cryptography & Security
biscuit-auth = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
hex = "0.4"

# Asynchronous Runtime & Data Buffers
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
bytes = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }

# Identifiers & Timestamps
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
ed25519-dalek = { workspace = true }
tempfile = "3"
rand = { workspace = true }

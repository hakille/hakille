[package]
name = "annora-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
annora-core = { path = "../annora-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
chacha20poly1305 = { workspace = true }

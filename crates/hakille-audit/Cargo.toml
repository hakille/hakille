[package]
name = "hakille-audit"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
hakille-core = { path = "../hakille-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { workspace = true }
async-trait = "0.1"
redb = { workspace = true }
ed25519-dalek = { workspace = true }
bytes = "1.0"
sha2 = "0.10"
bincode = "1.3"

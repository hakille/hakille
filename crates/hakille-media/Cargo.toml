[package]
name = "hakille-media"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Moteur génératif multimodal souverain (Image, Vidéo, Audio, DAG & Provenance Ed25519) pour Hakille"

[dependencies]
hakille-core = { path = "../hakille-core" }
hakille-constitution = { path = "../hakille-constitution" }
hakille-inference = { path = "../hakille-inference" }
hakille-voice = { path = "../hakille-voice" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }

base64 = "0.22"
tempfile = "3"
hound = "3.5.1"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

ort = { version = "=2.0.0-rc.14", features = ["download-binaries", "copy-dylibs"] }
candle-core = { version = "=0.11.1", default-features = false }
candle-nn = { version = "=0.11.1", default-features = false }
candle-transformers = { version = "=0.11.1", default-features = false }
tokenizers = { version = "=0.23.1", default-features = false, features = ["fancy-regex"] }

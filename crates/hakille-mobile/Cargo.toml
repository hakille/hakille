[package]
name = "hakille-mobile"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
ffi = ["dep:uniffi"]
cli = ["ffi", "uniffi/cli"]

[dependencies]
hakille-ui-protocol = { path = "../hakille-ui-protocol" }
hakille-ipc = { path = "../hakille-ipc" }
serde = { workspace = true }
serde_json = { workspace = true }
uniffi = { version = "=0.32.2", optional = true }

[[bin]]
name = "hakille-mobile-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["cli"]

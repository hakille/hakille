[package]
name = "hakille-auth"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
hakille-core = { path = "../hakille-core" }
hakille-identity = { path = "../hakille-identity" }
hakille-ui-protocol = { path = "../hakille-ui-protocol" }
biscuit-auth = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
zeroize = "1"

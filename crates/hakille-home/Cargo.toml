[package]
name = "hakille-home"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Moteur domotique souverain multi-protocoles, jumeau spatial 3D et homéostasie énergétique pour Hakille"
repository = "https://github.com/hakille/hakille"

[dependencies]
hakille-core = { path = "../hakille-core" }
hakille-mesh = { path = "../hakille-mesh" }
hakille-spatial = { path = "../hakille-spatial" }
hakille-memory = { path = "../hakille-memory" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true }
biscuit-auth = { workspace = true }
redb = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }
base64 = "0.22.1"
hex = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"

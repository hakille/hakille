[package]
name = "annora-keystore"
version = "0.1.0"
edition = "2024"
description = "OS-keychain-backed registry for Annora long-lived seeds (capability root, journal signing)"

# NOTE (confiance au boot) : dependances DIRECTES versionnees uniquement,
# jamais la table [workspace.dependencies] (normalise par l'integrateur).
[dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
zeroize = "1"
thiserror = "2"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

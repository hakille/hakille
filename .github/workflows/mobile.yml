name: Mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - "crates/hakille-mobile/**"
      - "crates/hakille-mobile-gateway/**"
      - "crates/hakille-substrate-mobile/**"
      - "crates/hakille-ipc/**"
      - "crates/hakille-ui-protocol/**"
      - "scripts/build-mobile-rust.sh"
      - "scripts/test-android-runtime.py"
      - "scripts/verify-android-apk.py"
      - "scripts/test-ios-simulator.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - name: SDK Android et NDK épinglés
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Contrats mobiles, FFI et passerelle HTTP
        run: cargo test -p hakille-mobile -p hakille-mobile-gateway -p hakille-substrate-mobile --features hakille-mobile/ffi --locked
      - name: Bibliothèques Android et bindings Kotlin
        run: scripts/build-mobile-rust.sh android
      - name: Application, tests réseau et lint Android
        working-directory: mobile/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Signature, alignement 16 Kio et politique TLS de l'APK final
        run: python3 scripts/verify-android-apk.py mobile/android/app/build/outputs/apk/debug/app-debug.apk --report target/mobile-validation/android/apk-verification.json
      - name: Accélération matérielle du simulateur Android
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Exécution Android réelle, JNA/Rust, rotation et retour au premier plan
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-boot-timeout: 600
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/test-android-runtime.py mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rapports Android, captures UI et diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakille-android-validation
          path: |
            target/mobile-validation/android/
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: hakille-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios-simulator:
    # XCTest s'exécute sur un simulateur ; aucune preuve de microphone matériel.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Générateur du projet Xcode
        run: brew install xcodegen
      - name: XCFramework et bindings Swift
        run: scripts/build-mobile-rust.sh ios --ios-x86_64-sim
      - name: Génération du projet Xcode
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Compilation puis exécution XCTest sur un simulateur disponible
        run: scripts/test-ios-simulator.sh
      - name: Résultats XCTest et journaux de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakille-ios-xctest
          path: target/mobile-validation/ios/
          if-no-files-found: warn

[package]
name = "hakille-e2e-mobile"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Requirement-driven opaque-box E2E test suite for Hakille Mobile"

[dependencies]
hakille-mobile = { path = "../../../crates/hakille-mobile" }
hakille-mobile-gateway = { path = "../../../crates/hakille-mobile-gateway" }
hakille-ui-protocol = { path = "../../../crates/hakille-ui-protocol" }
hakille-design = { path = "../../../crates/hakille-design" }
hakille-ipc = { path = "../../../crates/hakille-ipc" }
hakille-audit = { path = "../../../crates/hakille-audit" }
hakille-substrate = { path = "../../../crates/hakille-substrate" }
hakille-substrate-mobile = { path = "../../../crates/hakille-substrate-mobile" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true }
bytes = { workspace = true }
futures = "0.3"
uuid = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
rand = { workspace = true }
thiserror = { workspace = true }

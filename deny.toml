[advisories]
version = 2
vulnerability = "deny"
unmaintained = "warn"
unsound = "deny"
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CC0-1.0",
]

[bans]
version = 2
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
version = 2
unknown-registries = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

name: Hakille
options:
  bundleIdPrefix: dev.hakille
  deploymentTarget:
    iOS: "16.0"
  knownRegions: [en, fr]
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Hakille:
    type: application
    platform: iOS
    sources:
      - path: Hakille
      - path: Generated
        excludes: ["*.h", "*.modulemap", ".gitkeep"]
    dependencies:
      - framework: Frameworks/HakilleMobile.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hakille.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: build/Hakille-Info.plist
      properties:
        CFBundleDisplayName: Hakille
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: "Capture up to 30 seconds of speech after you tap Dictate. Audio recognition stays on this device; text only fills your draft."
        NSSpeechRecognitionUsageDescription: "Transcribe speech on this device after you tap Dictate. If local recognition is unavailable, dictation will not start."
        NSLocalNetworkUsageDescription: "Connect to the Hakille hub you explicitly selected on your local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  HakilleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Hakille
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Hakille:
    build:
      targets:
        Hakille: all
        HakilleTests: [test]
    test:
      targets: [HakilleTests]
